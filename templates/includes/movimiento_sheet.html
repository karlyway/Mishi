<div class="m-sheet-backdrop" id="mishi-mov-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-mov-title" aria-hidden="true">
    <div class="m-sheet-scrim" data-close-sheet="mishi-mov-sheet"></div>
    <div class="m-sheet-panel m-sheet-panel--mov" role="document">
        <div class="m-sheet-handle-wrap" data-close-sheet="mishi-mov-sheet" aria-hidden="true">
            <span class="m-sheet-handle"></span>
        </div>

        <div class="m-sheet-head">
            <h2 id="sheet-mov-title">Agregar gasto</h2>
            <button type="button" class="m-sheet-close" data-close-sheet="mishi-mov-sheet" aria-label="Cerrar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <form action="{% url 'movimiento' %}" method="POST" id="mishi-sheet-mov-form" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">

            <div class="m-sheet-seg" role="radiogroup" aria-label="Tipo de movimiento">
                <span class="m-sheet-seg-thumb" aria-hidden="true"></span>
                <label class="m-sheet-seg-opt">
                    <input type="radio" name="tipo" value="gasto" checked>
                    <span>Gasto</span>
                </label>
                <label class="m-sheet-seg-opt">
                    <input type="radio" name="tipo" value="ingreso">
                    <span>Ingreso</span>
                </label>
            </div>

            <div class="m-sheet-amount-stage" id="sheet-amount-stage">
                <label for="sheet-monto" class="sr-only">Monto en pesos colombianos</label>
                <div class="m-sheet-amount-row">
                    <span class="m-sheet-sign" id="sheet-amount-sign">-$</span>
                    <input type="number" id="sheet-monto" name="monto"
                           class="m-sheet-amount-input money-num"
                           placeholder="0" min="100" step="any" inputmode="decimal"
                           autocomplete="off" required>
                    <span class="m-sheet-cop">COP</span>
                </div>
                <p class="m-sheet-balance-hint">
                    Disponible: <strong class="money-num">${{ sheet_saldo_fmt|default:"0" }}</strong> · Límite hoy: <strong class="money-num">${{ sheet_limite_diario_fmt|default:"0" }}</strong>
                </p>
                <p class="m-sheet-error" id="sheet-monto-err" role="alert"></p>
            </div>

            <div class="m-sheet-section">
                <span class="m-sheet-lbl">Categoría</span>
                <div class="m-sheet-cats" role="radiogroup" aria-label="Categoría del movimiento">
                    {% for cat in sheet_categorias_ui %}
                    <button type="button"
                            class="m-sheet-cat-chip {% if forloop.first %}is-selected{% endif %}"
                            data-sheet-cat="{{ cat.idCategoria }}"
                            data-sheet-cat-name="{{ cat.nombre|lower }}">
                        <span class="m-sheet-cat-ico tone-{{ cat.ui.tone }}">
                            {% include 'includes/cat_icon.html' with icon=cat.ui.icon %}
                        </span>
                        <span class="m-sheet-cat-name">{{ cat.nombre }}</span>
                    </button>
                    {% endfor %}
                </div>
                <input type="hidden" name="categoria" id="sheet-categoria" value="{% if sheet_categorias_ui %}{{ sheet_categorias_ui.0.idCategoria }}{% endif %}">
            </div>

            <div class="m-sheet-fields-row">
                <div class="m-sheet-field m-sheet-field--grow">
                    <label for="sheet-desc" class="m-sheet-lbl">Descripción</label>
                    <input type="text" id="sheet-desc" name="descripcion" class="m-sheet-input"
                           placeholder="Ej: Almuerzo, pasaje, fotocopias" maxlength="120">
                </div>
                <div class="m-sheet-field m-sheet-field--date">
                    <label for="sheet-fecha" class="m-sheet-lbl">Fecha</label>
                    <input type="date" id="sheet-fecha" name="fecha" class="m-sheet-input"
                           value="{{ sheet_hoy_iso }}" max="{{ sheet_hoy_iso }}" required>
                </div>
            </div>
            <p class="m-sheet-error" id="sheet-fecha-err" role="alert"></p>

            <button type="submit" class="m-sheet-submit" id="sheet-mov-submit">
                Guardar gasto
            </button>
        </form>
    </div>
</div>
