<div class="m-sheet-backdrop" id="mishi-mas-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-mas-title" aria-hidden="true">
    <div class="m-sheet-scrim" data-close-sheet="mishi-mas-sheet"></div>
    <div class="m-sheet-panel m-sheet-panel--compact" role="document">
        <div class="m-sheet-handle-wrap" data-close-sheet="mishi-mas-sheet" aria-hidden="true">
            <span class="m-sheet-handle"></span>
        </div>

        <div class="m-sheet-head">
            <h2 id="sheet-mas-title">Más opciones</h2>
            <button type="button" class="m-sheet-close" data-close-sheet="mishi-mas-sheet" aria-label="Cerrar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="m-mas-list">
            <a href="{% url 'metas' %}" class="m-mas-row">
                <span class="m-mas-ico is-orange">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
                    </svg>
                </span>
                <span class="m-mas-copy">
                    <strong>Metas de ahorro</strong>
                    <span>Objetivos, progreso y fecha estimada</span>
                </span>
                <svg class="m-mas-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>

            <a href="{% url 'presupuestos' %}" class="m-mas-row">
                <span class="m-mas-ico is-amber">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 11h8M8 15h4"/>
                    </svg>
                </span>
                <span class="m-mas-copy">
                    <strong>Presupuestos</strong>
                    <span>Límites mensuales, diarios y alertas</span>
                </span>
                <svg class="m-mas-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>

            <a href="{% url 'categorias' %}" class="m-mas-row">
                <span class="m-mas-ico is-indigo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M21.2 9A9 9 0 0 0 15 2.8V9z"/>
                    </svg>
                </span>
                <span class="m-mas-copy">
                    <strong>Gastos por categoría</strong>
                    <span>Distribución porcentual del período</span>
                </span>
                <svg class="m-mas-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>

            <a href="{% url 'metas' %}?tab=prestamos" class="m-mas-row">
                <span class="m-mas-ico is-green">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/>
                    </svg>
                </span>
                <span class="m-mas-copy">
                    <strong>Préstamos con amigos</strong>
                    <span>Controla quién te debe o a quién le debes</span>
                </span>
                <svg class="m-mas-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>

            <a href="{% url 'animo' %}" class="m-mas-row">
                <span class="m-mas-ico is-slate">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                </span>
                <span class="m-mas-copy">
                    <strong>Descanso Mishi</strong>
                    <span>Una pausa consciente con tus hábitos</span>
                </span>
                <svg class="m-mas-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>
        </div>
    </div>
</div>
