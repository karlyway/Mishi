{% extends 'base.html' %}

{% block title %}Iniciar Sesion - Mishi{% endblock %}

{% block content %}
<div class="card form-shell-sm reveal">
    <p class="eyebrow">Acceso</p>
    <h1 style="font-size: 26px; font-weight: 500; letter-spacing: -0.03em; margin-bottom: 6px;">Iniciar sesion</h1>
    <p style="font-size: 14px; color: var(--fg-muted); margin-bottom: 22px;">Ingresa a tu cuenta de estudiante en Mishi</p>

    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <div class="form-group">
            <label for="usuario">Correo electrónico o usuario</label>
            <input type="text" id="usuario" name="usuario" class="form-control"
                   placeholder="usuario@universidad.edu.co" autocomplete="username" required value="">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="••••••••" autocomplete="current-password" required value="">
        </div>

        <div style="margin-top: 22px;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--fg-muted);">
        ¿No tienes una cuenta? <a href="{% url 'registro_usuario' %}" style="font-weight: 600; text-decoration: underline;">Crear cuenta</a>
    </div>
</div>
{% endblock %}
