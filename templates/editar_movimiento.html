{% extends 'base.html' %}

{% block title %}Editar Movimiento - Mishi{% endblock %}

{% block content %}
<div class="app-screen app-screen--narrow reveal">
    <div class="app-sub-topbar">
        <a href="{% url 'historial' %}" class="icon-circle-btn" aria-label="Volver al historial">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </a>
        <h1>Editar movimiento</h1>
        <span style="width: 38px;"></span>
    </div>

    <div class="app-card">
        <form method="POST">
            {% csrf_token %}

            {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <div class="segmented-control app-segmented">
                <input type="radio" id="tipo-gasto" name="tipo" value="gasto" {% if movimiento.tipo == 'gasto' %}checked{% endif %}>
                <label for="tipo-gasto">Gasto</label>
                <input type="radio" id="tipo-ingreso" name="tipo" value="ingreso" {% if movimiento.tipo == 'ingreso' %}checked{% endif %}>
                <label for="tipo-ingreso">Ingreso</label>
            </div>

            <div class="form-group">
                <label for="monto">Monto (COP)</label>
                <input type="number" id="monto" name="monto"
                       class="form-control app-field input-monto-grande" min="100" step="0.01" inputmode="decimal"
                       value="{{ movimiento.monto|stringformat:'.2f' }}" required>
            </div>

            <div class="grid-2" style="margin-bottom: 0; gap: 12px;">
                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" class="form-control app-field" required>
                        {% for cat in categorias %}
                            <option value="{{ cat.idCategoria }}"
                            {% if cat.idCategoria == movimiento.idCategoria.idCategoria %}selected{% endif %}>
                                {{ cat.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha"
                           class="form-control app-field"
                           value="{{ movimiento.fecha|date:'Y-m-d' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion"
                       class="form-control app-field"
                       value="{{ movimiento.descripcion }}">
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    Guardar cambios
                </button>
                <a href="{% url 'historial' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
