
{% extends 'base.html' %}

{% block title %}Registrar Movimiento - Mishi{% endblock %}

{% block content %}
<div class="page-title">
    <h1>Registrar movimiento</h1>
    <p>Ingresa los datos del gasto o ingreso.</p>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form action="{% url 'movimiento' %}" method="POST">
        {% csrf_token %}

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <div class="form-group">
            <label for="tipo">Tipo de transacción</label>
            <select id="tipo" name="tipo" class="form-control" required>
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
            </select>
        </div>

        <div class="form-group">
            <label for="monto">Monto (COP)</label>
            <input type="number" id="monto" name="monto"
                   class="form-control" min="100" step="100" required>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" class="form-control" required>
                {% for cat in categorias %}
                    <option value="{{ cat.idCategoria }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion"
                   class="form-control" placeholder="Ej: Almuerzo, transporte">
        </div>

        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha"
                   class="form-control" value="{% now 'Y-m-d' %}" required>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">
                Guardar movimiento
            </button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
